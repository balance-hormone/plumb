name: Release
# A pushed version tag publishes to npm through trusted publishing (OIDC), so
# no npm token or maintainer's second factor is involved.
on:
  push:
    tags: ['v*']
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm from packageManager
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install
        run: npm ci
      # prepublishOnly builds, then runs npm run check: the CLI and e2e tests run dist.
      - name: Publish
        run: npm publish
        env:
          PLUMB_DENYLIST: ${{ secrets.PLUMB_DENYLIST }}
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
